name = "papertok-report-api"
main = "worker/index.ts"
compatibility_date = "2026-07-16"

# Declarar `[[routes]]` hace que wrangler apague workers.dev por defecto, y esa
# es la URL que sigue llamando el bundle en produccion: sin esta linea, el
# despliegue que anade api.papertok.app deja la web viva sin API. Se queda
# encendida hasta que el frontend haya migrado del todo.
workers_dev = true

# El Custom Domain del Worker. Cloudflare crea aqui el registro DNS y el
# certificado al desplegar, y solo puede hacerlo con la zona papertok.app ya en
# la cuenta: un deploy antes de mover los nameservers falla con "zone not
# found". La ruta nativa papertok-report-api.<cuenta>.workers.dev sigue viva.
[[routes]]
pattern = "api.papertok.app"
custom_domain = true

[vars]
# 5174/5175 are here because Vite increments the port when 5173 is taken, and a
# missing origin only shows up as a blocked POST after a successful preflight.
ALLOWED_ORIGINS = "https://papertok.app,https://www.papertok.app,https://papertok-ten.vercel.app,https://mugar123.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:4175,http://127.0.0.1:4175"
# NaN Builders answers every AI route since 2026-10-06, when the Gemini
# allowance ran out (key: the NAN_API_KEY secret). "gemini" switches all of
# them back to the Gemini models below.
AI_PROVIDER = "nan"
# NaN's DeepSeek V4 Flash, used by every route while AI_PROVIDER is "nan".
NAN_MODEL = "deepseek-v4-flash"
AI_MODEL = "gemini-3.5-flash"
AI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
AI_DAILY_USER_LIMIT = "10"
AI_DAILY_GLOBAL_LIMIT = "1000"
# Paper rewrites stream from this model. Falls back to AI_MODEL when unset.
AI_REWRITE_MODEL = "gemini-3.5-flash"
FIREBASE_WEB_API_KEY = "AIzaSyAQKtRz0-PJH7_xOBrFhGeQdbIAHkzV4Q0"
# Not a secret: the project id is in every client bundle already. The service
# account email and its private key are wrangler secrets, never in this file.
FIREBASE_PROJECT_ID = "papertok-168df"
# Publishing a list costs one read and three writes. These caps keep the route
# far under the Firebase Spark daily allowance (20k writes, 50k reads).
PUBLIC_LIST_USER_DAILY_LIMIT = "60"
PUBLIC_LIST_GLOBAL_DAILY_LIMIT = "2000"
WORKER_PUBLIC_URL = "https://api.papertok.app"
EMAIL_PROVIDER = "brevo"
EMAIL_DAILY_SEND_LIMIT = "290"
PROVIDER_USER_MINUTE_LIMIT = "60"
PROVIDER_GLOBAL_MINUTE_LIMIT = "2000"
# OpenAlex bills per call against a daily budget ($1/day on a free key), and the
# guest feed reads it without a session, so the ceiling here is global rather
# than per user. It is reserved only after an edge-cache miss.
OPENALEX_GLOBAL_MINUTE_LIMIT = "300"
# And a daily one, because the budget is daily and the per-minute ceiling bounds
# nothing against it: 300/min is 432.000/day. Measured on /health/openalex the
# allowance is $1/day = 10.000 calls, so this leaves ~2.000 for the digest cron
# (which spends outside this ledger) and the health probe.
OPENALEX_GLOBAL_DAILY_LIMIT = "8000"
# PubMed and Semantic Scholar limit by provider, not by caller, and the guest feed
# reads both, so their ceiling is global like OpenAlex's. Each miss spends three
# E-utilities calls, six if every one is refused once and retried -- what NCBI
# actually refuses is per-second bursts, which a per-minute ceiling cannot see;
# withPubmedRetry is what absorbs those. So 60 route misses a minute are at most
# 360 calls, and NCBI_API_KEY (set since 2026-09-01; /health reports
# pubmedKeyConfigured) buys 10 req/s = 100 misses a minute at that worst case.
# 60 is a deliberate margin, not the anonymous 3 req/s it once mirrored, and it
# has never been the binding limit (151/151 reservations accepted, 2026-09-01).
# Sixty is also roughly the 1 req/s Semantic Scholar allows, shared by
# /sources/s2 and /related, which spend the same allowance.
PUBMED_GLOBAL_MINUTE_LIMIT = "60"
S2_GLOBAL_MINUTE_LIMIT = "60"

[[kv_namespaces]]
binding = "NOTIFICATION_STORE"
id = "45c1519982dd48f8a0ea08403c159ae1"

# A rewrite is identical for every reader, so it is cached globally in KV rather
# than per edge. Until a dedicated namespace exists, ai-rewrite.js falls back to
# NOTIFICATION_STORE under a "rewrite:" prefix. To separate them, run
# `npx wrangler kv namespace create AI_REWRITE_STORE` and uncomment this block
# with the id it prints.
# [[kv_namespaces]]
# binding = "AI_REWRITE_STORE"
# id = "<id from wrangler kv namespace create>"

# Workers AI, for toMarkdown only: it turns a paper's PDF into the text NaN
# reads in /ai/rewrite (worker/paper-text.ts). No model runs on it.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "EMAIL_DELIVERY_LEDGER"
class_name = "EmailDeliveryLedger"

[[durable_objects.bindings]]
name = "REQUEST_QUOTA_LEDGER"
class_name = "RequestQuotaLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KimiBudgetLedger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmailDeliveryLedger"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RequestQuotaLedger"]

[triggers]
crons = ["*/20 7-13 * * *"]
