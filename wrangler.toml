name = "papertok-report-api"
main = "worker/instrumentation.ts"
compatibility_date = "2026-07-16"
# `enable_request_signal` aborts `request.signal` when the client goes away,
# which the feed's slow-request line reads (worker/README.md, "Slow feed requests").
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
upload_source_maps = true

# Production traffic uses api.papertok.app.
workers_dev = false

# A harvest invocation can execute many persisted steps before it yields.
# Its accumulated CPU exceeded the default 30 seconds in both ingestion and
# embedding. This script-wide ceiling also applies to HTTP invocations.
#
# Its subrequests accumulate the same way: fetches, D1 calls (a batch is one),
# Workers AI calls, the quota ledger and the cache, until a wait longer than the
# Workflows engine's 5-minute grace period moves the run to a new invocation.
# On 2026-10-25 the first by-year run reached the 10,000 default after its lane
# phases (about 6,000) and 38 enrichment batches (about 100 each): the step
# failed on its first attempt and on the retries at 1, 2 and 4 minutes, all in
# the same invocation, and ran on the fifth attempt, after 8 minutes, in a fresh
# one. The longest run the code allows comes to about 66,000 (worker/README.md,
# the paper store's limits); a test keeps the enrichment phase for typical DOIs
# within half of this value, and the harvest's OpenAlex share bounds it for
# longer ones. Subrequests are not billed themselves; each provider's calls stay
# bounded by its budget.
[limits]
cpu_ms = 120_000
subrequests = 100_000

# The paper store's D1 primary runs in Western Europe (WEUR) without read
# replicas, and a first /store/papers page makes several D1 calls in sequence,
# each a round trip from wherever the fetch handler runs. The fetch handler runs
# in the Cloudflare data center Cloudflare picks near aws:eu-central-1 (Frankfurt
# on 2026-10-28; it may change), next to that I/O, for every route, instead of
# at the reader's location. Smart Placement (mode = "smart") never moved it at
# PaperTok's traffic. This does not move the crons, the nightly harvest they
# start or Durable Objects that already exist; objects the fetch handler creates
# from now on, such as each /ai/rewrite session, and the harvest Workflow runs
# that /store/papers starts for newly followed lanes are created from Frankfurt.
# Keep it here:
# a dashboard setting is undone by the next deploy from the repo
# (worker/README.md, the paper store's placement).
[placement]
region = "aws:eu-central-1"

# The share card's renderer (worker/share-card-render.ts): its two
# WebAssembly engines travel compiled, the only way a Worker may run them, and
# its fonts and etchings as bytes. `wrangler types` declares these modules.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Match source assets and the hashed filenames emitted for the no-bundle upload.
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.png"]
fallthrough = false

# Cloudflare provisions DNS and TLS for the custom domain in this account.
[[routes]]
pattern = "api.papertok.app"
custom_domain = true

[vars]
# 5174/5175 are here because Vite increments the port when 5173 is taken, and a
# missing origin only shows up as a blocked POST after a successful preflight.
ALLOWED_ORIGINS = "https://papertok.app,https://www.papertok.app,https://papertok-ten.vercel.app,https://mugar123.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:4175,http://127.0.0.1:4175"
# NaN Builders answers every AI route since 2026-10-06, when the Gemini
# allowance ran out (key: the NAN_API_KEY secret). "gemini" switches all of
# them back to the Gemini models below.
AI_PROVIDER = "nan"
# NaN's DeepSeek V4 Flash, used by every route while AI_PROVIDER is "nan".
NAN_MODEL = "deepseek-v4-flash"
AI_MODEL = "gemini-3.5-flash"
AI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
AI_DAILY_USER_LIMIT = "10"
AI_DAILY_GLOBAL_LIMIT = "1000"
# Paper rewrites stream from this model. Falls back to AI_MODEL when unset.
AI_REWRITE_MODEL = "gemini-3.5-flash"
FIREBASE_WEB_API_KEY = "AIzaSyAQKtRz0-PJH7_xOBrFhGeQdbIAHkzV4Q0"
# Not a secret: the project id is in every client bundle already. The service
# account email and its private key are wrangler secrets, never in this file.
FIREBASE_PROJECT_ID = "papertok-168df"
# Publishing a list costs one read and three writes. These caps keep the route
# far under the Firebase Spark daily allowance (20k writes, 50k reads).
PUBLIC_LIST_USER_DAILY_LIMIT = "60"
PUBLIC_LIST_GLOBAL_DAILY_LIMIT = "2000"
WORKER_PUBLIC_URL = "https://api.papertok.app"
EMAIL_DAILY_SEND_LIMIT = "100"
# The sender is public (every email shows it), so it lives here rather than in a secret.
# Its domain must be verified in Resend; /health/email checks it against Resend's domain list.
RESEND_FROM_EMAIL = "Nico de PaperTok <noreply@updates.papertok.app>"
PROVIDER_USER_MINUTE_LIMIT = "60"
PROVIDER_GLOBAL_MINUTE_LIMIT = "2000"
# /access cache misses per account and app-wide per UTC minute, an allowance of
# its own so a fast scroller never spends the one above. Each miss asks Crossref,
# the library's resolver (up to two calls) and, for SFX, Unpaywall.
ACCESS_USER_MINUTE_LIMIT = "120"
ACCESS_GLOBAL_MINUTE_LIMIT = "1000"
# /institution/services requests per account and app-wide per UTC hour. Each may
# probe the library's resolver dozens of times; a cold library takes the client
# up to ten requests, and the client keeps the list for a day.
INSTITUTION_SERVICES_USER_HOURLY_LIMIT = "30"
INSTITUTION_SERVICES_GLOBAL_HOURLY_LIMIT = "600"
# OpenAlex bills per call against a daily budget ($1/day on a free key), and the
# guest feed reads it without a session, so the ceiling here is global rather
# than per user. It is reserved only after an edge-cache miss. Counted in list
# calls like the day: 3000 is the 300 searches a minute it allowed when every
# call counted as one.
OPENALEX_GLOBAL_MINUTE_LIMIT = "3000"
# And a daily one, because the budget is daily and the per-minute ceiling bounds
# nothing against it: 3000/min is 4.320.000/day. Both ceilings count list calls
# ($0.0001); a search, billed $0.001, is reserved as ten. The daily value has
# two roles. It is the cap: the day's ceiling never exceeds it. And it is the
# fallback: until OpenAlex reports the key's remaining budget for the day
# (x-ratelimit-remaining-usd, less a 200-unit margin), or whenever that header
# is missing, it is the ceiling. Measured on /health/openalex the allowance is
# $1/day = 10.000 calls. The cap is the whole allowance because the reading,
# not the cap, is what keeps room for the digest cron (which spends outside this
# ledger) and the health probe: at 8.000 a reading could only lower the ceiling,
# and on 2026-10-22 the ledger refused readers' search, Explorer and card
# lookups all day with ~4.000 calls of the key unspent. Before the day's first
# reading the fallback allows the whole allowance; OpenAlex itself stops the key
# at $1, so the cap cannot cost money. The corpus harvest spends from this same
# day, up to its own 4.000 (OPENALEX_HARVEST_DAILY_UNITS), and each budget
# tier closes at its share of the ceiling (OPENALEX_TIER_PERCENT), both in
# worker/provider-runtime.ts; /health/openalex/budget reports the day. Keep
# this value here: a dashboard edit is undone by the next deploy from the repo.
OPENALEX_GLOBAL_DAILY_LIMIT = "10000"
# PubMed and Semantic Scholar limit by provider, not by caller, and the guest feed
# reads both, so their ceiling is global like OpenAlex's. Each miss spends three
# E-utilities calls, six if every one is refused once and retried -- what NCBI
# actually refuses is per-second bursts, which a per-minute ceiling cannot see;
# withPubmedRetry is what absorbs those. So 60 route misses a minute are at most
# 360 calls, and NCBI_API_KEY (set since 2026-09-01; /health reports
# pubmedKeyConfigured) buys 10 req/s = 100 misses a minute at that worst case.
# 60 is a deliberate margin, not the anonymous 3 req/s it once mirrored, and it
# has never been the binding limit (151/151 reservations accepted, 2026-09-01).
# Sixty is also roughly the 1 req/s Semantic Scholar allows, shared by
# /sources/s2, /related and /enrich/s2 (the enrichment's abstract batch), which
# spend the same allowance.
PUBMED_GLOBAL_MINUTE_LIMIT = "60"
S2_GLOBAL_MINUTE_LIMIT = "60"
# /resources/figures misses a minute, app-wide; each one fetches arxiv.org/html
# and ar5iv. Hits are free. Each address may send 20 of them (worker/source-api.ts),
# so a 429 there is either the minute or one address's 20. Set on 2026-10-24;
# revisit after a week of the { route: "/resources/figures", status: 429 } lines
# in Workers Logs.
FIGURES_GLOBAL_MINUTE_LIMIT = "60"
# /resources/full-text misses a minute, app-wide; each one fetches at most
# arxiv.org/html, ar5iv and two Europe PMC calls. Hits are free. Each address may
# send 20 of them (worker/source-api.ts).
FULL_TEXT_GLOBAL_MINUTE_LIMIT = "60"

# Estimated input tokens the paper store may embed per UTC day (worker/paper-store.ts;
# its history is in worker/README.md, harvest step 6). 7.5M estimated is at most
# about 8,100 neurons, inside the free 10,000 a day with room for the PDF
# conversions. A day's new papers (~5,000) stay inside it, so the ceiling spends
# nothing, and an older backlog drains behind them. A re-listing adds only the
# papers new to a year's 100. Raising it to drain a backlog sooner is a spending
# decision (AGENTS.md): "60000000" is at most 64,500 neurons, ~$0.60 a day past
# the free allocation at $0.011 per 1,000 neurons. Past a backlog, a higher value
# only lets a fault, or the papers readers' lookups and follows bring, spend
# money: the nightly run embeds them without a share. Nothing lowers it by
# itself: after a raise, set it back here, and deploy, once fewer than 5,000
# works lack a vector:
#   SELECT COUNT(*) FROM works w WHERE NOT EXISTS (SELECT 1 FROM work_vectors v WHERE v.work_id = w.id)
# The day's usage so far counts against the new value: deployed on a day that
# already spent more, it embeds nothing until 00:00 UTC.
EMBEDDING_DAILY_TOKEN_LIMIT = "7500000"

# Also holds the OpenAlex relay's shared answers under the `openalex:v1:` prefix
# (worker/openalex-api.ts), global where the edge cache is per location, and the
# rewrite cache under `rewrite:` (below).
[[kv_namespaces]]
binding = "NOTIFICATION_STORE"
id = "45c1519982dd48f8a0ea08403c159ae1"

# The library lists of /institution/services: one record per library with a
# verdict per catalogue entry (worker/institution-services.ts). Global, unlike
# the per-location edge cache, and read on every request for the list.
[[kv_namespaces]]
binding = "INSTITUTION_SERVICES_STORE"
id = "a6b32a20ed4748139e828f1cbeff5b93"

# A rewrite is identical for every reader, so it is cached globally in KV rather
# than per edge. Until a dedicated namespace exists, ai-rewrite.js falls back to
# NOTIFICATION_STORE under a "rewrite:" prefix. To separate them, run
# `npx wrangler kv namespace create AI_REWRITE_STORE` and uncomment this block
# with the id it prints.
# [[kv_namespaces]]
# binding = "AI_REWRITE_STORE"
# id = "<id from wrangler kv namespace create>"

# Workers AI: toMarkdown turns a paper's PDF into the text NaN reads in
# /ai/rewrite (worker/paper-text.ts), and the paper store embeds papers with
# EMBEDDING_MODEL (worker/paper-store.ts).
[ai]
binding = "AI"

# The paper store (worker/paper-store.ts): every feed source's papers, their
# lanes and vectors, filled by the harvest Workflow and read by /store/papers.
# Apply migrations with `npx wrangler d1 migrations apply PAPER_STORE --remote`
# before deploying. The exception was 0011, a one-time data migration applied
# right after the Worker that lists the notable lanes by year was deployed and
# before the harvest was triggered (worker/README.md, step 3); it finds nothing
# to clear on a fresh database.
[[d1_databases]]
binding = "PAPER_STORE"
database_name = "papertok-paper-store"
database_id = "f3440843-6097-4c1d-ba66-d6450c3986c7"
migrations_dir = "worker/migrations"

# One instance a day, started by the 02:30 UTC cron (worker/paper-harvest.ts),
# and one for each feed request that brings follows nobody had asked for,
# within 20 new lanes a reader and 2,000 in all a UTC day (worker/paper-feed.ts).
# Past them the nightly instance harvests those follows.
[[workflows]]
name = "papertok-paper-harvest"
binding = "PAPER_HARVEST"
class_name = "PaperHarvestWorkflow"

[[durable_objects.bindings]]
name = "EMAIL_DELIVERY_LEDGER"
class_name = "EmailDeliveryLedger"

[[durable_objects.bindings]]
name = "REQUEST_QUOTA_LEDGER"
class_name = "RequestQuotaLedger"

[[durable_objects.bindings]]
name = "PAPER_REWRITE_SESSION"
class_name = "PaperRewriteSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KimiBudgetLedger"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmailDeliveryLedger"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RequestQuotaLedger"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["PaperRewriteSession"]

[[migrations]]
tag = "v5"
deleted_classes = ["KimiBudgetLedger"]

[triggers]
# Digests every 20 minutes in the morning; the paper harvest once a day.
crons = ["*/20 7-13 * * *", "30 2 * * *"]

# Workers Logs: keeps the Worker's console lines, 3 days on the Free plan
# (worker/README.md, "Logs"). This block has to stay: without it every
# `wrangler deploy` switches Workers Logs off, whatever the dashboard says.
[observability]
enabled = true
head_sampling_rate = 1

# Invocation logs would add one record per request with its full URL, and the
# URL carries search text and unsubscribe tokens. Off: only console lines.
[observability.logs]
invocation_logs = false

# Gives GET /health the id and tag of the version that is answering.
[version_metadata]
binding = "CF_VERSION_METADATA"
