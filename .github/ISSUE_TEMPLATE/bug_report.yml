name: Bug report
description: Report a problem with PaperTok.
body:
  - type: markdown
    attributes:
      value: |
        Never include API keys, private user data, or authenticated responses. Remove personal information from screenshots and logs before posting.
        For security vulnerabilities, use the private reporting instructions in [SECURITY.md](https://github.com/mugar123/papertok/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the problem and which part of PaperTok it affects.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps someone else can follow, starting with the page you opened.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include the browser version, operating system, and device type.
      placeholder: Chrome 140, Android 16, phone
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: PaperTok uses English. Note your browser language and whether browser translation was enabled.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or additional details
      description: Add screenshots or logs if useful. Remove API keys, private user data, and authenticated responses first.
