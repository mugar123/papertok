<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- iOS < 16.4 ignora display:standalone del manifest; estos meta son el equivalente legacy. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaperTok" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PaperTok is an application for exploring and discovering scientific papers from multiple sources." />
    <meta name="theme-color" content="#ffffff" />
    <!-- The address of the page never leaves in a request header.

         Measured in a browser, not assumed: with the default policy,
         `strict-origin-when-cross-origin`, a
         SAME-ORIGIN subresource request carries the full URL as `Referer` — so
         a reader on /public/paper/<key> made the app's own
         `<script src="/_vercel/insights/script.js">` announce that key to
         Vercel's edge, on every page view, in a header. The analytics payload
         itself has always been normalized (`sanitizeAnalyticsEventUrl`), and
         under HashRouter the header was harmless too: a fragment is stripped
         from `Referer`, so it read `https://papertok.app/` whatever route you
         were on. Real paths (src/main.jsx) put the identifier back in it.

         /privacy.html promises the opposite in as many words: "reading a
         specific paper is recorded as /public/paper/:id [...] Which one never
         travels." `strict-origin` caps every request this document makes — the
         analytics script, the API calls, an outbound link to a publisher — at
         the origin, so the promise does not depend on any one of them behaving.
         Not `no-referrer`: an origin-restricted API key checks this header, and
         `https://papertok.app/` still satisfies such a check. -->
    <meta name="referrer" content="strict-origin" />
    <!-- El tema, resuelto antes del primer pintado. Decidirlo en React es
         decidirlo después de haber pintado la página en blanco: un fogonazo
         blanco en cada carga para quien lee a oscuras. Es el espejo de
         src/utils/theme.js — si cambia uno, cambia el otro. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('papertok_theme');
          var prefersDark = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#111318' : '#ffffff');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Just the name. This is the string a browser saves as the bookmark
         title and prints under a Favourites tile, where a tagline only gets
         truncated. The descriptive version still travels with shared links,
         in `og:title` and `twitter:title` below. -->
    <title>PaperTok</title>
    <script id="papertok-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PaperTok",
        "url": "https://papertok.app/",
        "description": "PaperTok is an application for exploring and discovering scientific papers from multiple sources.",
        "inLanguage": ["en-US", "es-ES"]
      }
    </script>
    <!-- Fonts are self-hosted (see src/main.jsx) — no more Google Fonts
         preconnect or render-blocking cross-origin stylesheet here. -->
    <!-- The first three requests of every session, in order: the auth gate
         (identitytoolkit), the Firestore listens behind it, and the Worker.
         Warming DNS+TLS here overlaps the handshakes with the JS download
         instead of paying them serially once the bundle boots. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://api.papertok.app" crossorigin>
  </head>
