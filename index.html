<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- iOS < 16.4 ignora display:standalone del manifest; estos meta son el equivalente legacy. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaperTok" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PaperTok es una aplicación para explorar y descubrir artículos científicos de distintas fuentes." />
    <meta name="theme-color" content="#ffffff" />
    <!-- El tema, resuelto antes del primer pintado. Decidirlo en React es
         decidirlo después de haber pintado la página en blanco: un fogonazo
         blanco en cada carga para quien lee a oscuras. Es el espejo de
         src/utils/theme.js — si cambia uno, cambia el otro. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('papertok_theme');
          var prefersDark = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#111318' : '#ffffff');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="canonical" href="https://mugar123.github.io/papertok/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperTok" />
    <meta property="og:title" content="PaperTok — Descubre investigación científica" />
    <meta property="og:description" content="PaperTok es una aplicación para explorar y descubrir artículos científicos de distintas fuentes." />
    <meta property="og:url" content="https://mugar123.github.io/papertok/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://mugar123.github.io/papertok/og/papertok-share-0.2.png" />

    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:image:alt" content="Vista de un artículo científico en PaperTok" />
    <!-- Just the name. This is the string a browser saves as the bookmark
         title and prints under a Favourites tile, where a tagline only gets
         truncated. The descriptive version still travels with shared links,
         in `og:title` and `twitter:title` below. -->
    <title>PaperTok</title>
    <script id="papertok-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PaperTok",
        "url": "https://mugar123.github.io/papertok/",
        "description": "PaperTok es una aplicación para explorar y descubrir artículos científicos de distintas fuentes.",
        "inLanguage": ["es-ES", "en-US"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap" rel="stylesheet">
    <!-- The first three requests of every session, in order: the auth gate
         (identitytoolkit), the Firestore listens behind it, and the Worker.
         Warming DNS+TLS here overlaps the handshakes with the JS download
         instead of paying them serially once the bundle boots. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://papertok-report-api.papertok-mugar123.workers.dev" crossorigin>
  </head>
