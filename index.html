<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- iOS < 16.4 ignora display:standalone del manifest; estos meta son el equivalente legacy. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PaperTok" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PaperTok is an application for exploring and discovering scientific papers from multiple sources." />
    <meta name="theme-color" content="#fbf8f0" />
    <!-- The address of the page never leaves in a request header.

         Measured in a browser, not assumed: with the default policy,
         `strict-origin-when-cross-origin`, a
         SAME-ORIGIN subresource request carries the full URL as `Referer` — so
         a reader on /paper/<key> made the app's own
         `<script src="/_vercel/insights/script.js">` announce that key to
         Vercel's edge, on every page view, in a header. The analytics payload
         itself has always been normalized (`sanitizeAnalyticsEventUrl`), and
         under HashRouter the header was harmless too: a fragment is stripped
         from `Referer`, so it read `https://papertok.app/` whatever route you
         were on. Real paths (src/main.tsx) put the identifier back in it.

         /privacy.html promises the opposite in as many words: "Page
         addresses have query strings, fragments and individual paper, list
         and profile identifiers removed." `strict-origin` caps every request this document makes — the
         analytics script and requests, the API calls, an outbound link to a publisher — at
         the origin, so the promise does not depend on any one of them behaving.
         Not `no-referrer`: an origin-restricted API key checks this header, and
         `https://papertok.app/` still satisfies such a check. -->
    <meta name="referrer" content="strict-origin" />
    <!-- El tema, resuelto antes del primer pintado. Decidirlo en React es
         decidirlo después de haber pintado la página en blanco: un fogonazo
         blanco en cada carga para quien lee a oscuras. Es el espejo de
         src/utils/theme.ts — si cambia uno, cambia el otro. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('papertok_theme');
          var prefersDark = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#14161d' : '#fbf8f0');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="canonical" href="https://papertok.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperTok" />
    <meta property="og:title" content="PaperTok — Discover scientific research" />
    <meta property="og:description" content="PaperTok is an application for exploring and discovering scientific papers from multiple sources." />
    <meta property="og:url" content="https://papertok.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://papertok.app/og/papertok-share-0.3.png" />
    <meta property="og:image:alt" content="PaperTok: Scientific papers, in one feed. Like TikTok, but you come out smarter. Etchings of a microscope, a magnifying glass, test tubes and old scrolls." />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaperTok — Discover scientific research" />
    <meta name="twitter:description" content="PaperTok is an application for exploring and discovering scientific papers from multiple sources." />
    <meta name="twitter:url" content="https://papertok.app/" />
    <meta name="twitter:image" content="https://papertok.app/og/papertok-share-0.3.png" />
    <meta name="twitter:image:alt" content="PaperTok: Scientific papers, in one feed. Like TikTok, but you come out smarter. Etchings of a microscope, a magnifying glass, test tubes and old scrolls." />
    <!-- Just the name. This is the string a browser saves as the bookmark
         title and prints under a Favourites tile, where a tagline only gets
         truncated. The descriptive version still travels with shared links,
         in `og:title` and `twitter:title` below. -->
    <title>PaperTok</title>
    <script id="papertok-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PaperTok",
        "url": "https://papertok.app/",
        "description": "PaperTok is an application for exploring and discovering scientific papers from multiple sources.",
        "inLanguage": ["en-US", "es-ES"]
      }
    </script>
    <!-- Fonts are self-hosted (see src/main.tsx) — no more Google Fonts
         preconnect or render-blocking cross-origin stylesheet here. -->
    <!-- The first three requests of every session, in order: the auth gate
         (identitytoolkit), the Firestore listens behind it, and the Worker.
         Warming DNS+TLS here overlaps the handshakes with the JS download
         instead of paying them serially once the bundle boots. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://api.papertok.app" crossorigin>
  </head>
  <body>
    <!-- This screen must remain usable when the application assets fail to load. -->
    <style>
      body { margin: 0; }
      #startup-status {
        --bg-primary: #fbf8f0;
        --text-primary: #1d2b53;
        --accent-primary-hover: #3e4a6b;
        --text-secondary: #46527a;
        --brand-yellow: #ffd21e;
        --text-on-brand: #1d2b53;
        --accent-sky: #0369a1;
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary);
        color: var(--text-primary);
        font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      html[data-theme="dark"] #startup-status {
        --bg-primary: #14161d;
        --text-primary: #f4ecd8;
        --accent-primary-hover: #d2ccbc;
        --text-secondary: #b9b1a0;
        --accent-sky: #5bade9;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #startup-status {
          --bg-primary: #14161d;
          --text-primary: #f4ecd8;
          --accent-primary-hover: #d2ccbc;
          --text-secondary: #b9b1a0;
          --accent-sky: #5bade9;
        }
      }
      .startup-petri {
        display: block;
        width: 8.5rem;
        height: 8.25rem;
        margin-bottom: 16px;
        overflow: visible;
      }
      #startup-status[data-state="failed"] .startup-thinking,
      #startup-status:not([data-state="failed"]) .startup-upset { display: none; }
      #startup-status h1 {
        max-width: 18ch;
        margin: 0 0 12px;
        font: 600 clamp(1.9rem, 4.2vw, 2.6rem)/1.08 "Iowan Old Style", Georgia, serif;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      #startup-status p {
        max-width: 34ch;
        margin: 0 0 32px;
        color: var(--text-secondary);
        text-wrap: pretty;
      }
      #startup-retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        min-width: 160px;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--text-primary);
        border-radius: 3px;
        background: var(--text-primary);
        color: var(--bg-primary);
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        transition: scale 150ms ease-out, background-color 150ms ease-out;
      }
      #startup-status[data-state="loading"] #startup-retry { background: transparent; color: var(--text-primary); }
      #startup-retry:active { scale: 0.97; }
      #startup-retry:focus { outline: 2px solid var(--text-primary); outline-offset: 3px; }
      @media (hover: hover) and (pointer: fine) {
        #startup-retry:hover { border-color: var(--accent-primary-hover); background: var(--accent-primary-hover); }
        #startup-status[data-state="loading"] #startup-retry:hover {
          border-color: var(--text-primary);
          background: color-mix(in srgb, var(--text-primary) 7%, var(--bg-primary));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-retry { transition: none; }
        #startup-retry:active { scale: none; }
      }
    </style>
    <section id="startup-status" role="status" aria-live="polite" aria-atomic="true" data-state="loading">
      <svg class="startup-petri" viewBox="14 22 128 124" aria-hidden="true" focusable="false">
        <defs>
          <pattern id="startup-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="1.4" height="4" fill="currentColor"/></pattern>
        </defs>
        <g stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
          <ellipse cx="78" cy="128" rx="62" ry="15" fill="var(--bg-primary)"/>
          <ellipse cx="78" cy="124" rx="54" ry="10" fill="url(#startup-hatch)" stroke-width="1.6"/>
          <path d="M48 124c-14-20-4-56 30-58 26-2 40 18 38 36-1 12-3 20-6 22Z" fill="var(--brand-yellow)" stroke="var(--brand-yellow)"/>
          <path d="M62 66l-4-8M78 62l-1-9M94 64l3-8" fill="none" stroke-width="2"/>
          <g class="startup-thinking">
            <circle cx="73" cy="87" r="3.4" fill="var(--text-on-brand)" stroke="none"/>
            <circle cx="91" cy="87" r="3.4" fill="var(--text-on-brand)" stroke="none"/>
            <path d="M86 76q5-3 10 0" fill="none" stroke="var(--text-on-brand)" stroke-width="2"/>
            <path d="M73 98q8 7 16 0" fill="none" stroke="var(--text-on-brand)" stroke-width="2.2"/>
            <path d="M108 40q0-10 10-10t10 9q0 6-6 9t-4 9" fill="none" stroke-width="4"/>
            <circle cx="118" cy="66" r="2.6" fill="currentColor" stroke="none"/>
          </g>
          <g class="startup-upset">
            <path d="M66 82l9-4M98 82l-9-4" fill="none" stroke="var(--text-on-brand)" stroke-width="2"/>
            <circle cx="73" cy="88" r="3.4" fill="var(--text-on-brand)" stroke="none"/>
            <circle cx="91" cy="88" r="3.4" fill="var(--text-on-brand)" stroke="none"/>
            <path d="M74 102q7-5 14 0" fill="none" stroke="var(--text-on-brand)" stroke-width="2.2"/>
            <path d="M103 66q-5 7-2 11 4 2 6-2 0-4-4-9Z" fill="var(--accent-sky)" stroke="var(--text-on-brand)" stroke-width="1.2"/>
          </g>
        </g>
      </svg>
      <h1 id="startup-title">Loading PaperTok</h1>
      <p id="startup-message">Your page will appear here shortly.</p>
      <noscript>
        <style>#startup-title, #startup-message { display: none; }</style>
        <h1>JavaScript is turned off</h1>
        <p>Enable JavaScript in your browser, then reload this page.</p>
      </noscript>
      <a id="startup-retry" href="">Reload page</a>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
